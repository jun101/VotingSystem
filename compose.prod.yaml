# Production stack of the online edition (docs/slices/19c-installers.md, step E). Installed and updated by
# installers/online/install-online.sh and `votectl`; never started from a development checkout.
# Everything is read from the `.env` file next to this one (written by the installer, mode 0600).
# The images are pinned by VOTE_VERSION; nothing is built on the server. No Mailpit. Only the proxy publishes ports.
name: votesystem

x-api: &api
  image: ${VOTE_REGISTRY:-ghcr.io/jun101}/votesystem-api:${VOTE_VERSION:?set by the installer}
  environment: &api-environment
    DEPLOYMENT_MODE: online
    APP_NAME: ${APP_NAME:-VoteSystem}
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: ${SITE_URL:?set by the installer}
    APP_KEY: ${APP_KEY:?set by the installer}
    VOTE_AUDIT_PUBLIC_KEY: ${VOTE_AUDIT_PUBLIC_KEY:?set by the installer}
    CREDENTIAL_HASH_KEY: ${CREDENTIAL_HASH_KEY:?set by the installer}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_HOST: db
    DB_DATABASE: ${DB_DATABASE:-votesystem}
    # The serving containers know the `app` account only; `migrator` goes to the one-off `migrate` service.
    DB_USERNAME: app
    DB_PASSWORD: ${DB_PASSWORD:?set by the installer}
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:?set by the installer}
    MAIL_MAILER: ${MAIL_MAILER:-smtp}
    MAIL_HOST: ${MAIL_HOST:-localhost}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_SCHEME: ${MAIL_SCHEME:-}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@localhost}
    SESSION_COOKIE: ${SESSION_COOKIE:-votesystem_session}
  volumes:
    # What the application writes: the generated files and the imports (storage), and the re-encoded pictures.
    - storage:/var/www/html/storage
    - media:/var/www/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  proxy:
    image: caddy:2.11.7-alpine
    # The only published ports. On a server of its own, 80 and 443; behind another proxy the installer binds them
    # to 127.0.0.1 on free ports and SITE_ADDRESS is a plain `:80`.
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set by the installer}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      # The certificates: kept across restarts and updates (a lost volume means new requests to the authority).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # Caddy answers for its own names only (and redirects them to HTTPS), so the check is that it listens.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  api:
    <<: *api
    command:
      - php
      - artisan
      - octane:start
      - --server=frankenphp
      - --host=0.0.0.0
      - --port=8000
      - --workers=${API_WORKERS:-4}
      - --max-requests=500
      - --log-level=warn
    healthcheck:
      # Healthy when the API answers at all: 200, or 503 when a service it needs is down.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/health | grep -qE '^(200|503)$'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  queue:
    <<: *api
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # One-off, never part of the stack: `docker compose run --rm migrate` (installer and `votectl update`).
  # Migrations as `migrator`, then the table-by-table rights of `app`.
  migrate:
    <<: *api
    profiles: ["tools"]
    restart: "no"
    environment:
      <<: *api-environment
      DB_USERNAME: migrator
      DB_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set by the installer}
      DB_APP_USERNAME: app
    command: ["sh", "-c", "php artisan migrate --force && php artisan db:grant-app"]
    healthcheck:
      disable: true

  web:
    image: ${VOTE_REGISTRY:-ghcr.io/jun101}/votesystem-web:${VOTE_VERSION:?set by the installer}
    environment:
      API_INTERNAL_URL: http://api:8000
      DEPLOYMENT_MODE: online
      SITE_URL: ${SITE_URL:?set by the installer}
      SESSION_COOKIE: ${SESSION_COOKIE:-votesystem_session}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  db:
    image: mariadb:12.3.3
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set by the installer}
      MARIADB_ROOT_HOST: localhost
      DB_DATABASE: ${DB_DATABASE:-votesystem}
      DB_PASSWORD: ${DB_PASSWORD:?set by the installer}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set by the installer}
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.10.2
    command: ["redis-server", "/etc/redis-auth.conf", "--appendonly", "yes"]
    configs:
      - source: redis_auth
        target: /etc/redis-auth.conf
        mode: 0444
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

configs:
  redis_auth:
    content: |
      requirepass ${REDIS_PASSWORD:?set by the installer}

volumes:
  db_data:
  redis_data:
  storage:
  media:
  caddy_data:
  caddy_config:
