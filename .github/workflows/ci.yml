# Runs the same make targets as a developer does (see the Makefile). Only Docker is needed.
name: CI

# Only a pull request into `main` runs the checks (slices are merged into `staging` first).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Pint, PHPStan, ESLint, Prettier, tsc)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make setup
      - run: make lint

  test:
    name: Tests (API against MariaDB and Redis, web unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make setup
      - run: make test

  generate:
    name: OpenAPI file and TypeScript types are up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make setup
      - run: make generate-check

  build:
    name: Production build of the web application
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make build

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make setup
      - run: make audit

  audit-runtime:
    name: Security audit (composer audit --locked, npm audit --omit=dev)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PHP runtime is at the patched version everywhere (pins, then the image itself)
        run: sh docker/scripts/check-php-pins.sh --image
      - name: Composer advisories (locked versions)
        run: docker run --rm -v "$PWD/api":/app -w /app composer:2.10.3 audit --locked
      - name: npm advisories (production dependencies, high and above)
        run: docker run --rm -v "$PWD/web":/app -w /app node:24.22.1-trixie-slim npm audit --omit=dev --audit-level=high

  e2e:
    name: Browser tests against the running stack
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make setup
      - run: make up
      - run: make e2e
      - name: Keep the report when a browser test fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
