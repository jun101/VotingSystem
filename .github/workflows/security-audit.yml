# Weekly dependency audit, the same checks as the `audit-runtime` job of ci.yml. It also catches advisories
# published after the last pull request. The PHP floor is MIN_PHP in docker/scripts/check-php-pins.sh: raise it when a PHP security release is out.
name: Security audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: composer audit --locked, npm audit --omit=dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PHP runtime is at the patched version everywhere (pins, then the image itself)
        run: sh docker/scripts/check-php-pins.sh --image
      - name: Composer advisories (locked versions)
        run: docker run --rm -v "$PWD/api":/app -w /app composer:2.10.3 audit --locked
      - name: npm advisories (production dependencies, high and above)
        run: docker run --rm -v "$PWD/web":/app -w /app node:24.22.1-trixie-slim npm audit --omit=dev --audit-level=high
