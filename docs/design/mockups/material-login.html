<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Archivo:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--grad-a:#C944B6;--grad-b:#A66EDC;--grad-c:#7A92EE;--panel:#7488F0;--panel-deep:#5F73E6;--primary:#5468D4;--primary-hover:#4458C2;--ink:#14162B;--muted:#5A5F7A;--line:#D5D9EC;--surface:#FFFFFF;--accent:#F29A76;--sand:#F7D9A8}
body{margin:0;font-family:Roboto,system-ui,sans-serif;color:var(--ink)}
a{color:var(--primary);text-decoration:none;font-weight:500}a:hover{text-decoration:underline}
.stage{min-height:820px;box-sizing:border-box;padding:48px 24px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--grad-a),var(--grad-b) 45%,var(--grad-c));background-size:220% 220%;animation:drift 14s ease-in-out infinite}
@keyframes drift{0%,100%{background-position:0% 30%}50%{background-position:100% 70%}}
.card{width:100%;max-width:1000px;min-height:560px;display:flex;flex-wrap:wrap;background:var(--surface);border-radius:28px;box-shadow:0 2px 4px rgba(20,22,43,.12),0 24px 48px -12px rgba(20,22,43,.35);position:relative;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
.side{flex:1 1 340px;min-width:0;position:relative;background:var(--panel);border-radius:28px 0 0 28px;padding:36px 36px 0;box-sizing:border-box;min-height:480px;overflow:visible}
.form{flex:1 1 380px;min-width:0;box-sizing:border-box;padding:44px 56px 40px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.art{position:absolute;left:12px;bottom:18px;width:116%;max-width:560px;z-index:2;pointer-events:none}
@media (max-width:760px){.side{border-radius:28px 28px 0 0;min-height:340px;overflow:hidden}.art{width:100%;left:0}.form{padding:32px 24px}}
.field{position:relative;padding-top:18px}
.field input{width:100%;box-sizing:border-box;border:0;border-bottom:2px solid var(--line);background:transparent;font:400 16px Roboto,sans-serif;color:var(--ink);padding:12px 40px 10px 0;outline:none;transition:border-color .2s}
.field input:focus{border-bottom-color:var(--primary)}
.field label{position:absolute;left:0;top:32px;font-size:16px;color:var(--muted);pointer-events:none;transition:all .18s ease;transform-origin:left top}
.field input:focus+label,.field input:not(:placeholder-shown)+label{top:6px;font-size:12px;color:var(--primary);font-weight:500}
.field .bar{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--primary);transition:width .3s}
.field input:focus~.bar{width:100%}
.eye{position:absolute;right:0;bottom:8px;width:32px;height:32px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.eye:hover{background:#EEF0FB}
.btn{position:relative;overflow:hidden;border:0;border-radius:28px;height:52px;background:var(--primary);color:#fff;font:500 16px Roboto,sans-serif;letter-spacing:.3px;cursor:pointer;box-shadow:0 2px 4px rgba(84,104,212,.35),0 8px 18px -6px rgba(84,104,212,.6);transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{background:var(--primary-hover);transform:translateY(-2px);box-shadow:0 4px 8px rgba(84,104,212,.35),0 14px 24px -6px rgba(84,104,212,.65)}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.lang{position:absolute;top:20px;right:28px;display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);font:400 14px Roboto,sans-serif;cursor:pointer;padding:6px 10px;border-radius:16px}
.lang:hover{background:#EEF0FB}
.blobA{animation:floaty 7s ease-in-out infinite}
.blobB{animation:floaty 9s ease-in-out infinite reverse}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.paper{animation:drop 3.6s ease-in infinite}
@keyframes drop{0%{transform:translateY(-46px);opacity:0}15%{opacity:1}60%{transform:translateY(0);opacity:1}70%,100%{transform:translateY(8px);opacity:0}}
.bubble{animation:pop 4s ease-in-out infinite}
.bubble2{animation:pop 4s ease-in-out 1.6s infinite}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.85}50%{transform:scale(1.06);opacity:1}}
.leaf{transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
.stagger>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.stagger>*:nth-child(1){animation-delay:.15s}.stagger>*:nth-child(2){animation-delay:.25s}.stagger>*:nth-child(3){animation-delay:.35s}.stagger>*:nth-child(4){animation-delay:.45s}.stagger>*:nth-child(5){animation-delay:.55s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<main class="stage">
<div class="card">
  <aside class="side">
    <svg width="48" height="48" viewBox="0 0 48 48" aria-label="Vote" role="img"><rect width="48" height="48" rx="14" fill="#fff"/><path d="M13 25l7 7 15-17" fill="none" stroke="#5F73E6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <p style="margin:28px 0 0;max-width:300px;font:800 26px/1.2 Archivo,sans-serif;color:#fff;letter-spacing:-.2px">Des élections claires, pour chaque école.</p>
    <svg class="art" viewBox="0 0 560 330" aria-hidden="true">
      <g class="blobA"><path d="M70 250C40 170 90 90 180 80c70-8 120-60 190-30 70 30 110 100 80 170-30 70-110 90-190 90-90 0-80-20-190-60z" fill="#5F73E6"/></g>
      <g class="blobB"><path d="M150 262c-25-60 20-110 90-120 60-8 110 25 120 85 8 50-30 75-100 78-70 3-95-5-110-43z" fill="#9DB0FA"/></g>
      <g class="leaf"><path d="M70 300c-4-40 4-80 22-112" stroke="#1E2A5A" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M92 190c-26-6-40-30-36-52 26 4 42 24 36 52z" fill="#1E2A5A"/><path d="M92 190c24-14 48-8 58 10-24 14-48 10-58-10z" fill="#F7D9A8"/><path d="M80 236c-24-2-38-20-34-40 24 2 38 18 34 40z" fill="#F7D9A8"/></g>
      <rect x="40" y="296" width="500" height="6" rx="3" fill="#4658C9" opacity=".6"/>
      <g><rect x="250" y="206" width="170" height="92" rx="10" fill="#F29A76"/><rect x="250" y="206" width="170" height="22" rx="10" fill="#E5805B"/><rect x="298" y="212" width="74" height="9" rx="4.5" fill="#7A3B25"/><path d="M262 244l14 14 28-30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/></g>
      <g class="paper"><rect x="312" y="176" width="52" height="38" rx="5" fill="#fff"/><path d="M322 190h32M322 199h20" stroke="#7488F0" stroke-width="4" stroke-linecap="round"/></g>
      <g><circle cx="196" cy="212" r="17" fill="#FFD8B8"/><path d="M178 206c4-18 30-20 36-4-10-4-24-4-36 4z" fill="#1E2A5A"/><rect x="176" y="230" width="42" height="68" rx="16" fill="#F7D9A8"/><rect x="170" y="268" width="56" height="30" rx="10" fill="#2E3B8E"/></g>
      <g class="bubble"><rect x="200" y="120" width="64" height="40" rx="12" fill="#fff"/><path d="M214 160l-4 14 20-14z" fill="#fff"/><path d="M214 134h36M214 144h24" stroke="#9DB0FA" stroke-width="4" stroke-linecap="round"/></g>
      <g class="bubble2"><rect x="290" y="96" width="52" height="34" rx="12" fill="#F29A76"/><circle cx="308" cy="113" r="4" fill="#fff"/><circle cx="324" cy="113" r="4" fill="#fff"/></g>
    </svg>
  </aside>
  <section class="form">
    <button class="lang" type="button" aria-label="Choisir la langue">Français <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z" fill="currentColor"/></svg></button>
    <div class="stagger" style="display:flex;flex-direction:column;gap:22px">
      <div>
        <h1 style="margin:0;font:800 28px Archivo,sans-serif;letter-spacing:-.3px">Connexion</h1>
        <p style="margin:6px 0 0;color:var(--muted);font-size:15px">Accédez au panneau de votre établissement.</p>
      </div>
      <div class="field"><input id="email" type="email" placeholder=" " autocomplete="email"><label for="email">Adresse e-mail</label><span class="bar"></span></div>
      <div class="field"><input id="pw" type="password" placeholder=" " autocomplete="current-password"><label for="pw">Mot de passe</label><span class="bar"></span>
        <button class="eye" type="button" aria-label="Afficher le mot de passe"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:-10px"><a href="#" style="font-size:14px">Mot de passe oublié ?</a></div>
      <button class="btn" type="button">Se connecter</button>
      <p style="margin:0;color:var(--muted);font-size:14px">Pas encore de compte ? <a href="Register.dc.html">Créer un compte</a></p>
    </div>
  </section>
</div>
</main>
</x-dc>

</script>
</body>
</html>
