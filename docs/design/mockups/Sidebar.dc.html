<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Menu latéral</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Menu principal" style="box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 4px; padding: 18px 14px 16px; background: #111B33; color: #FFFFFF; font-family: 'Public Sans', sans-serif">
<a href="Home.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 0 6px 12px; color: #FFFFFF; text-decoration: none">
<span style="flex-shrink: 0; width: 38px; height: 38px; border-radius: 10px; background: #FFFFFF; color: #111B33; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">CE</span>
<span style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; font-weight: 700">VoteSystem</span>
<span style="font-size: 12px; color: #C9D3EA">Collège Étoile du Matin</span>
</span>
</a>
<div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px; border: 1px solid #36425F; border-radius: 10px; background: #1B2747">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9D3EA" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
<label for="sb-goto" style="position: absolute; clip: rect(0 0 0 0)">Aller à une page, un électeur, une élection</label>
<input id="sb-goto" type="search" placeholder="Aller à…" style="flex-grow: 1; min-width: 0; height: 40px; border: 0; background: transparent; color: #FFFFFF; font: inherit; font-size: 14px">
<kbd style="padding: 1px 7px; border: 1px solid #5A6788; border-radius: 5px; color: #C9D3EA; font-family: inherit; font-size: 12px">/</kbd>
</div>
<a href="ElectionNew.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; margin: 6px 0 4px; border-radius: 10px; background: #FFFFFF; color: #111B33; font-size: 14px; font-weight: 700; text-decoration: none">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
Nouvelle élection
</a>
<span style="padding: 10px 10px 4px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #9FACC9">Établissement</span>
<sc-for list="{{ instItems }}" as="item" hint-placeholder-count="4">
<a href="{{ item.href }}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 8px; background: {{ item.bg }}; color: {{ item.fg }}; font-size: 14px; font-weight: 600; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ item.icon }}"></path></svg>
<span style="flex-grow: 1">{{ item.label }}</span>
<sc-if value="{{ item.hasCount }}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; box-sizing: border-box; padding: 2px 7px; border-radius: 999px; background: {{ item.countBg }}; color: {{ item.countFg }}; font-size: 12px; font-weight: 700; text-align: center">{{ item.count }}</span></sc-if>
</a>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 8px; margin: 12px 0 2px; padding: 12px; border: 1px solid #36425F; border-radius: 12px; background: #1B2747">
<div style="display: flex; align-items: center; gap: 8px">
<span style="flex-grow: 1; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #9FACC9">Élection choisie</span>
<a href="Elections.dc.html" style="display: flex; align-items: center; min-height: 44px; margin: -14px 0; color: #C9D3EA; font-size: 12px; font-weight: 600">Changer</a>
</div>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; line-height: 1.15; font-weight: 700">Conseil des élèves 2026</span>
<div style="display: flex; align-items: center; gap: 8px">
<span style="display: flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; background: {{ stageBg }}; color: #FFFFFF; font-size: 12px; font-weight: 700"><span style="width: 7px; height: 7px; border-radius: 50%; background: #FFFFFF"></span>{{ stageLabel }}</span>
</div>
<div style="height: 6px; border-radius: 3px; background: #36425F" role="img" aria-label="Participation"><div style="width: {{ stageBar }}; height: 6px; border-radius: 3px; background: #FFFFFF"></div></div>
<span style="font-size: 12px; line-height: 1.35; color: #C9D3EA">{{ stageMeta }}</span>
</div>
<span style="padding: 8px 10px 4px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #9FACC9">Cette élection</span>
<sc-for list="{{ elecItems }}" as="item" hint-placeholder-count="6">
<a href="{{ item.href }}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 8px; background: {{ item.bg }}; color: {{ item.fg }}; font-size: 14px; font-weight: 600; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ item.icon }}"></path></svg>
<span style="flex-grow: 1">{{ item.label }}</span>
<sc-if value="{{ item.hasCount }}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; box-sizing: border-box; padding: 2px 7px; border-radius: 999px; background: {{ item.countBg }}; color: {{ item.countFg }}; font-size: 12px; font-weight: 700; text-align: center">{{ item.count }}</span></sc-if>
</a>
</sc-for>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 12px 6px 0; border-top: 1px solid #36425F">
<span style="flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; background: #C2410C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">MJ</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
<span style="font-size: 14px; font-weight: 600">Marie-Claire Jean</span>
<span style="font-size: 12px; color: #C9D3EA">Propriétaire</span>
</span>
<button aria-label="Changer de langue" style="min-width: 44px; height: 44px; border: 1px solid #36425F; border-radius: 8px; background: transparent; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 700">FR</button>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"home","options":["home","elections","institution","audit","overview","ballots","voters","codes","turnout","results"]},"stage":{"editor":"enum","default":"open","options":["draft","scheduled","open","closed"]},"$preview":{"width":272,"height":940}}'>
class Component extends DCLogic {
renderVals() {
var active = this.props.active || 'home';
var stage = this.props.stage || 'open';
var stages = {
draft: { label: 'Brouillon', bg: '#4A556B', bar: '0%', meta: 'Pas encore planifiée. 4 postes, 300 électeurs.' },
scheduled: { label: 'Planifié', bg: '#1E3A8A', bar: '0%', meta: 'Ouvre lundi 12 oct. à 08 h 00.' },
open: { label: 'Ouvert', bg: '#0F766E', bar: '62%', meta: '62 % ont voté. Clôture dans 2 j 4 h.' },
closed: { label: 'Clôturé', bg: '#4A556B', bar: '91%', meta: '91 % de participation. Résultats à publier.' }
};
var s = stages[stage] || stages.open;
var counts = {
elections: ['5', 'n'],
ballots: ['4', 'n'],
voters: ['300', 'n'],
codes: stage === 'scheduled' ? ['226 sans code', 'w'] : null,
turnout: stage === 'open' ? ['62 %', 'g'] : null,
results: stage === 'closed' ? ['À publier', 'w'] : null
};
var tones = { n: ['#36425F', '#FFFFFF'], w: ['#FFE8D6', '#6B2408'], g: ['#D9F2EE', '#0B5750'] };
function make(key, label, href, icon) {
var c = counts[key];
var on = key === active;
return {
label: label, href: href, icon: icon,
bg: on ? '#1E3A8A' : 'transparent',
fg: on ? '#FFFFFF' : '#C9D3EA',
hasCount: !!c,
count: c ? c[0] : '',
countBg: c ? tones[c[1]][0] : 'transparent',
countFg: c ? tones[c[1]][1] : '#FFFFFF'
};
}
return {
stageLabel: s.label, stageBg: s.bg, stageBar: s.bar, stageMeta: s.meta,
instItems: [
make('home', 'Tableau de bord', 'Home.dc.html', 'M4 4h7v7H4zM13 4h7v4h-7zM13 12h7v8h-7zM4 15h7v5H4z'),
make('elections', 'Élections', 'Elections.dc.html', 'M4 10h16v10H4zM8 10V4h8v6M9 15h6'),
make('institution', 'Établissement', 'Institution.dc.html', 'M4 20V8l8-4 8 4v12M9 20v-6h6v6M3 20h18'),
make('audit', 'Journal d\'audit', 'Audit.dc.html', 'M6 4h12v16H6zM9 9h6M9 13h6M9 17h3')
],
elecItems: [
make('overview', 'Aperçu', 'Overview.dc.html', 'M10 6h10M10 12h10M10 18h10M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2'),
make('ballots', 'Postes et candidats', 'Ballots.dc.html', 'M4 5h16v14H4zM9 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6 16c.5-2 1.5-3 3-3s2.5 1 3 3M14 9h4M14 13h4'),
make('voters', 'Électeurs', 'Voters.dc.html', 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c.5-4 3-6 6.5-6s6 2 6.5 6M16 4.5a3.5 3.5 0 0 1 0 6.5M18 14.5c2 .8 3.2 2.600 3.5 5.5'),
make('codes', 'Codes d\'accès', 'Codes.dc.html', 'M8 19.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zM11.5 12L20 3.5M16 7.5l3 3'),
make('turnout', 'Participation', 'Turnout.dc.html', 'M4 20V10M10 20V4M16 20v-7M21 20H3'),
make('results', 'Résultats', 'AdminResults.dc.html', 'M6 21V4M6 4h11l-2 4 2 4H6')
]
};
}
}
</script>
</body>
</html>
