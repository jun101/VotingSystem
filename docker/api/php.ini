; Nothing about the server's software leaves in a header.
expose_php = Off
; Errors go to the log, never to the page.
display_errors = Off
log_errors = On
error_log = /dev/stderr
; The usual ceiling. A picture upload raises it around its decode only (ImageReEncoder).
memory_limit = 256M
date.timezone = UTC
opcache.enable = 1
opcache.validate_timestamps = 1
; Uploads: the application refuses a file above 5 MB itself (413); PHP's limits are a little
; higher so that the application, not PHP, answers in the usual case.
upload_max_filesize = 6M
post_max_size = 8M
